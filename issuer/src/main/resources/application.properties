# Issuer key pair (EC P-384) and certificate. ARMIS installs the applet with the
# SHA-384 of this public key. Set the key store location and passwords through
# the environment, e.g. ISSUER_SERVICE_SECURE_MESSAGING_KEY_STORE=file:/path/issuer.p12
issuer-service.secure-messaging.key-store-type=PKCS12
issuer-service.secure-messaging.key-alias=issuer-service
